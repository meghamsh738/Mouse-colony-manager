name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static, Unit, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colony_maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d colony_maintenance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/colony_maintenance?schema=public&sslmode=disable&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/colony_maintenance?schema=public&sslmode=disable
      AUTH_SECRET: colony-maintenance-ci-secret
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npm run db:prepare:ci

      - name: Static, unit, and build verification
        run: npm run verify

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colony_maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d colony_maintenance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/colony_maintenance?schema=public&sslmode=disable&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/colony_maintenance?schema=public&sslmode=disable
      AUTH_SECRET: colony-maintenance-ci-secret
      AUTH_URL: http://localhost:3005
      NEXTAUTH_URL: http://localhost:3005
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: npm run db:prepare:ci

      - name: Playwright tests
        run: npm run verify:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
            output/playwright
          if-no-files-found: ignore
